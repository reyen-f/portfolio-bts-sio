
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Site accessible uniquement en tapant son adresse : les moteurs de
       recherche ne doivent ni l'indexer, ni suivre ses liens, ni en garder
       de copie. Ne pas bloquer le site dans un robots.txt, sinon Google ne
       verrait plus cette consigne. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>Portfolio | Reyen Fourati</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    /* SEPARATEUR ACCUEIL / RUBRIQUES */
    .sidebar__separator {
      display: block;
      flex: 0 0 auto;
      width: 32px;
      height: 1px;
      margin: 4px auto 9px;
      border: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(129, 220, 255, .75),
        transparent
      );
      box-shadow: 0 0 8px rgba(50, 196, 255, .25);
      pointer-events: none;
    }

    /* SEPARATEUR RUBRIQUES / ENGAGEMENT (rouge Croix-Rouge) */
    .sidebar__separator--engagement {
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 116, 136, .8),
        transparent
      );
      box-shadow: 0 0 8px rgba(255, 116, 136, .3);
    }

    /* IDENTITE CYBER */
    .landing__cyber-id {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 20;
      width: max-content;
      max-width: calc(100% - 48px);
      padding: 15px 21px 17px;
      border: 1px solid rgba(77, 218, 255, .28);
      border-radius: 8px;
      background: linear-gradient(
        125deg,
        rgba(3, 14, 28, .82),
        rgba(2, 17, 31, .46)
      );
      box-shadow:
        inset 0 0 18px rgba(0, 184, 255, .05),
        0 0 24px rgba(0, 170, 255, .1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      opacity: 1;
      filter: brightness(1);
      transition:
        opacity .25s ease,
        filter .25s ease,
        transform .25s ease;
    }

    .landing__cyber-id.is-off {
      opacity: 0;
      filter: brightness(0);
      transform: translateY(-5px);
    }

    .landing__cyber-id::before,
    .landing__cyber-id::after {
      content: "";
      position: absolute;
      width: 33px;
      height: 26px;
      pointer-events: none;
    }

    .landing__cyber-id::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid #6cecff;
      border-left: 2px solid #6cecff;
      border-radius: 8px 0 0 0;
    }

    .landing__cyber-id::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid #6cecff;
      border-bottom: 2px solid #6cecff;
      border-radius: 0 0 8px 0;
    }

    .landing__cyber-name,
    .landing__cyber-role {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .landing__cyber-name {
      min-height: 1.35em;
      font-size: clamp(1.25rem, 2vw, 2rem);
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: .07em;
      color: #f6fdff;
      text-shadow: 0 0 12px rgba(124, 235, 255, .32);
    }

    .landing__cyber-role {
      margin-top: 6px;
      min-height: 1.6em;
      font-size: clamp(.59rem, .84vw, .87rem);
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: .12em;
      color: #d7f5ff;
    }

    .cyber-char {
      display: inline;
      animation: cyber-char-apparait .24s ease-out both;
    }

    .cyber-char--surname {
      color: #6cecff;
      text-shadow: 0 0 10px rgba(75, 213, 255, .7);
    }

    @keyframes cyber-char-apparait {
      0% {
        opacity: 0;
        filter: brightness(2.5) blur(2px);
      }
      55% {
        opacity: 1;
        filter: brightness(2.1) blur(0);
      }
      100% {
        opacity: 1;
        filter: brightness(1) blur(0);
      }
    }

    /* CURSEUR LUMINEUX */
    .cyber-cursor {
      display: none;
      width: 2px;
      height: .88em;
      margin-left: 3px;
      vertical-align: -.1em;
      background: #b7f8ff;
      box-shadow:
        0 0 8px #22d9ff,
        0 0 15px #22d9ff;
    }

    .cyber-cursor.is-active {
      display: inline-block;
      animation: curseur-clignote .8s steps(1, end) infinite;
    }

    @keyframes curseur-clignote {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* TRAIT LUMINEUX FINAL */
    .landing__cyber-line {
      position: relative;
      width: 72%;
      height: 2px;
      margin-top: 9px;
      background: linear-gradient(
        90deg,
        #80eaff,
        #159dca 48%,
        transparent
      );
      box-shadow: 0 0 10px rgba(26, 205, 255, .55);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left center;
      transition:
        transform .8s ease-out,
        opacity .2s ease;
    }

    .landing__cyber-id.is-complete .landing__cyber-line {
      opacity: 1;
      transform: scaleX(1);
    }

    .landing__cyber-line::before {
      content: "";
      position: absolute;
      top: -2px;
      left: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d8faff;
      box-shadow:
        0 0 9px #36dfff,
        0 0 18px #00bcff;
    }

    /* NAVIGATION ACCESSIBLE */
    #accueil[hidden],
    #interface[hidden] {
      display: none !important;
    }

    .landing__stage .scene-hitboxes {
      z-index: 30;
      pointer-events: none;
    }

    .landing__stage .scene-hotspot {
      cursor: pointer;
      pointer-events: auto !important;
      touch-action: manipulation;
      /* --pret : défini par bouton dans animations.css,
         quand son hologramme a fini d'apparaître */
      animation:
        boutons-clic-disponibles
        var(--pret, 3.2s)
        steps(1, end)
        both;
    }

    @keyframes boutons-clic-disponibles {
      0%, 99% {
        visibility: hidden;
      }
      100% {
        visibility: visible;
      }
    }

    #interface .sidebar__button {
      cursor: pointer;
      pointer-events: auto !important;
    }

    #interface .sidebar__nav {
      overflow-y: auto;
    }

    /* LES TROIS CATEGORIES DE PROJETS */
    .project-group {
      flex: 0 0 auto;
      border: 1px solid #314d64;
      border-radius: 13px;
      background: #192a3b;
      overflow: hidden;
    }

    .project-group.is-active {
      border-color: #72d9fd;
      box-shadow: 0 0 18px rgba(53, 185, 236, .12);
    }

    .project-group__toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 66px;
      padding: 13px 14px;
      color: #eaf8ff;
      border: 0;
      background: transparent;
      font: 600 .8rem/1.5 var(--font-body, sans-serif);
      text-align: left;
      cursor: pointer;
    }

    .project-group__toggle:hover,
    .project-group__toggle:focus-visible {
      background: #254057;
    }

    .project-group__icon {
      color: #76d9f9;
      display: inline-grid;
      place-items: center;
    }

    .project-group__icon .icon {
      width: 21px;
      height: 21px;
    }

    .project-group__label {
      flex: 1;
      min-width: 0;
    }

    .project-group__label strong {
      display: block;
      font-size: .82rem;
    }

    .project-group__label small {
      display: block;
      margin-top: 4px;
      color: #aac0d2;
      font-size: .65rem;
      font-weight: 400;
    }

    .project-group__chevron {
      width: 18px;
      height: 18px;
      color: #8db8ce;
      transform: rotate(0);
      transition: transform .2s;
    }

    .project-group.is-open .project-group__chevron {
      transform: rotate(90deg);
    }

    .project-group__contents {
      padding: 0 12px 12px 14px;
    }

    .project-group__contents[hidden] {
      display: none !important;
    }

    .project-group__empty {
      margin: 0;
      padding: 13px 12px;
      border-left: 2px solid #4a7085;
      border-radius: 0 8px 8px 0;
      background: #142435;
      color: #9eb8cb;
      font-size: .74rem;
      line-height: 1.6;
    }

    .project-group__contents .item-card {
      width: 100%;
      margin-top: 8px;
    }

    @media (max-width: 700px) {
      .sidebar__separator {
        width: 26px;
        margin: 3px auto 7px;
      }

      .landing__cyber-id {
        top: 12px;
        left: 12px;
        max-width: calc(100% - 24px);
        padding: 10px 12px 12px;
      }

      .landing__cyber-name {
        font-size: clamp(.9rem, 4.3vw, 1.15rem);
      }

      .landing__cyber-role {
        font-size: clamp(.48rem, 2.25vw, .65rem);
        letter-spacing: .055em;
      }

      .landing__mobile-nav {
        top: 127px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cyber-char,
      .cyber-cursor {
        animation: none !important;
      }

      .landing__cyber-line {
        transition: none !important;
      }

      .landing__stage .scene-hotspot {
        animation: none !important;
        visibility: visible;
      }
    }
  </style>

  <script src="js/app.js" defer></script>
  <script src="js/hologrammes.js" defer></script>
</head>

          <span class="vie-ecran" style="--n: 0; left: 44.74%; top: 31.46%; width: 11.72%; height: 12.11%"></span>

  <!-- ANIMATION DE L'IDENTITÉ ET VIDÉO -->
  <script>
    (() => {
      const accueil = document.getElementById("accueil");
      const video = document.getElementById("decor-video");
      const panneau = document.getElementById("cyber-identity");

      const nomTexte = document.getElementById("cyber-name-typed");
      const roleTexte = document.getElementById("cyber-role-typed");

      const nomCurseur = document.getElementById("cyber-name-cursor");
      const roleCurseur = document.getElementById("cyber-role-cursor");

      if (!accueil || !video || !panneau) return;

      const NOM = "REYEN FOURATI";
      const ROLE = "ÉTUDIANT BTS SIO - SISR";

      const INTRO_VIDEO = 3200;
      const VITESSE_NOM = 150;
      const VITESSE_ROLE = 95;
      const ATTENTE_DEPART = 750;
      const PAUSE_ENTRE_LIGNES = 450;
      const PAUSE_AVANT_TRAIT = 200;

      let animationCourante = 0;
      let accueilVisible = false;
      let introductionTerminee = false;
      let lectureDemandee = false;

      const mouvementReduit = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      function attendre(duree) {
        return new Promise(resolve =>
          window.setTimeout(resolve, duree)
        );
      }

      function estAccueilVisible() {
        return !accueil.hidden &&
          window.getComputedStyle(accueil).display !== "none";
      }

      function ajouterCaractere(conteneur, lettre, estNom) {
        const caractere = document.createElement("span");
        caractere.className = "cyber-char";

        caractere.textContent =
          lettre === " " ? "\u00a0" : lettre;

        caractere.setAttribute("aria-hidden", "true");

        if (estNom) {
          caractere.classList.add("cyber-char--surname");
        }

        conteneur.appendChild(caractere);
      }

      async function ecrireLigne(
        conteneur,
        curseur,
        texte,
        vitesse,
        numero,
        nomDeFamille
      ) {
        curseur.classList.add("is-active");

        for (let i = 0; i < texte.length; i++) {
          if (numero !== animationCourante) {
            return false;
          }

          ajouterCaractere(
            conteneur,
            texte[i],
            nomDeFamille && i >= 6
          );

          await attendre(vitesse);
        }

        if (numero !== animationCourante) {
          return false;
        }

        curseur.classList.remove("is-active");
        return true;
      }

      function eteindreIdentite() {
        animationCourante++;

        nomCurseur.classList.remove("is-active");
        roleCurseur.classList.remove("is-active");

        panneau.classList.add("is-off");
      }

      async function demarrerIdentite() {
        animationCourante++;
        const numero = animationCourante;

        nomTexte.textContent = "";
        roleTexte.textContent = "";

        nomCurseur.classList.remove("is-active");
        roleCurseur.classList.remove("is-active");

        panneau.classList.remove("is-complete", "is-off");

        if (mouvementReduit) {
          [...NOM].forEach((lettre, i) => {
            ajouterCaractere(nomTexte, lettre, i >= 6);
          });

          roleTexte.textContent = ROLE;
          panneau.classList.add("is-complete");
          return;
        }

        await attendre(ATTENTE_DEPART);

        if (numero !== animationCourante) return;

        if (!await ecrireLigne(
          nomTexte,
          nomCurseur,
          NOM,
          VITESSE_NOM,
          numero,
          true
        )) return;

        await attendre(PAUSE_ENTRE_LIGNES);

        if (numero !== animationCourante) return;

        if (!await ecrireLigne(
          roleTexte,
          roleCurseur,
          ROLE,
          VITESSE_ROLE,
          numero,
          false
        )) return;

        await attendre(PAUSE_AVANT_TRAIT);

        if (numero !== animationCourante) return;

        panneau.classList.add("is-complete");
      }

      /* VIDÉO EN BOUCLE */
      video.muted = true;
      video.loop = true;

      function lancerVideo() {
        if (
          !introductionTerminee ||
          !estAccueilVisible() ||
          video.readyState < 2 ||
          lectureDemandee ||
          mouvementReduit
        ) {
          return;
        }

        lectureDemandee = true;
        const demarrage = video.play();

        if (
          demarrage &&
          typeof demarrage.then === "function"
        ) {
          demarrage.then(() => {
            if (estAccueilVisible()) {
              video.classList.add("is-playing");
            }
          }).catch(() => {
            lectureDemandee = false;
            console.warn(
              "[Portfolio] Impossible de lire decor-loop.mp4."
            );
          });
        } else {
          video.classList.add("is-playing");
        }
      }

      video.addEventListener("loadeddata", lancerVideo);
      video.addEventListener("canplay", lancerVideo);

      window.setTimeout(() => {
        introductionTerminee = true;

        if (mouvementReduit) {
          video.pause();
          return;
        }

        try {
          video.currentTime = 0;
        } catch (erreur) {
          // Vidéo non encore prête
        }

        lancerVideo();
      }, INTRO_VIDEO);

      function synchroniserAccueil() {
        const visible = estAccueilVisible();

        if (visible === accueilVisible) return;

        accueilVisible = visible;

        if (visible) {
          demarrerIdentite();

          if (introductionTerminee) {
            lancerVideo();
          }
        } else {
          eteindreIdentite();
          video.pause();
          lectureDemandee = false;
          video.classList.remove("is-playing");
        }
      }

      new MutationObserver(synchroniserAccueil).observe(
        accueil,
        {
          attributes: true,
          attributeFilter: ["hidden", "style", "class"]
        }
      );

      document.addEventListener(
        "click",
        evenement => {
          const selection = evenement.target.closest(
            "#accueil [data-open-tab], " +
            "#accueil .scene-hotspot--cv, " +
            "#accueil .landing__mobile-nav a"
          );

          if (selection) {
            eteindreIdentite();
          }
        },
        true
      );

      synchroniserAccueil();
    })();
  </script>
